<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Happiest Birthday, Sanskriti ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Parisienne&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        min-height: 100%;
    }

    body {
        overflow: hidden;

        background:
            radial-gradient(
                circle at 50% 45%,
                #54263e 0%,
                #2b1222 28%,
                #120811 62%,
                #050307 100%
            );

        color: white;

        font-family:
            "DM Sans",
            sans-serif;

        cursor: default;
    }


    /* =====================================================
       DREAMY BACKGROUND
    ===================================================== */

    .background {
        position: fixed;
        inset: 0;

        overflow: hidden;

        z-index: 0;
    }


    .glow {
        position: absolute;

        border-radius: 50%;

        filter: blur(90px);

        pointer-events: none;
    }


    .glow.one {
        width: 420px;
        height: 420px;

        left: -120px;
        top: 15%;

        background: #ff6e9b;

        opacity: .14;

        animation:
            glowMove 10s
            ease-in-out
            infinite;
    }


    .glow.two {
        width: 500px;
        height: 500px;

        right: -180px;
        bottom: -120px;

        background: #a65cff;

        opacity: .12;

        animation:
            glowMove 12s
            2s
            ease-in-out
            infinite reverse;
    }


    .glow.three {
        width: 330px;
        height: 330px;

        left: 50%;
        top: 50%;

        transform:
            translate(-50%, -50%);

        background: #ff9ebc;

        opacity: .10;

        animation:
            centerGlow 5s
            ease-in-out
            infinite;
    }


    @keyframes glowMove {

        0%,
        100% {
            transform:
                translate(0, 0)
                scale(1);
        }

        50% {
            transform:
                translate(80px, -50px)
                scale(1.18);
        }

    }


    @keyframes centerGlow {

        0%,
        100% {
            transform:
                translate(-50%, -50%)
                scale(.8);

            opacity: .06;
        }

        50% {
            transform:
                translate(-50%, -50%)
                scale(1.25);

            opacity: .14;
        }

    }


    /* =====================================================
       STARS
    ===================================================== */

    .stars {
        position: absolute;
        inset: 0;

        background-image:
            radial-gradient(
                circle,
                rgba(255,255,255,.8) 1px,
                transparent 1px
            );

        background-size:
            85px 85px;

        opacity: .16;

        animation:
            starsMove
            25s
            linear
            infinite;
    }


    @keyframes starsMove {

        from {
            transform:
                translateY(0);
        }

        to {
            transform:
                translateY(-85px);
        }

    }


    /* =====================================================
       TOP DECORATION
    ===================================================== */

    .top-hearts {
        position: absolute;

        top: 35px;
        left: 50%;

        transform:
            translateX(-50%);

        display: flex;

        align-items: center;

        gap: 12px;

        color: #ffb5ca;

        opacity: .6;

        font-size: 13px;

        letter-spacing: 5px;
    }


    .top-hearts span:nth-child(2) {
        font-size: 22px;

        animation:
            tinyBeat
            1.5s
            ease-in-out
            infinite;
    }


    @keyframes tinyBeat {

        0%,
        100% {
            transform: scale(1);
        }

        50% {
            transform: scale(1.35);
        }

    }


    /* =====================================================
       MAIN
    ===================================================== */

    .main {
        position: relative;

        width: 100%;
        height: 100vh;

        min-height: 600px;

        z-index: 10;

        display: flex;

        align-items: center;
        justify-content: center;

        text-align: center;
    }


    .content {
        position: relative;

        z-index: 20;

        width: min(900px, 90%);

        transform:
            translateY(-10px);
    }


    /* =====================================================
       SMALL INTRO
    ===================================================== */

    .small-text {
        font-size: 10px;

        letter-spacing: 7px;

        text-transform: uppercase;

        color:
            rgba(255,255,255,.45);

        margin-bottom: 22px;

        opacity: 0;

        animation:
            reveal
            1.2s
            .5s
            forwards;
    }


    /* =====================================================
       MAIN WISH
    ===================================================== */

    .wish {
        font-family:
            "Parisienne",
            cursive;

        font-weight: 400;

        font-size:
            clamp(
                65px,
                9vw,
                120px
            );

        line-height: .9;

        color: #fff;

        text-shadow:
            0 0 25px
            rgba(255,150,180,.25),

            0 0 80px
            rgba(255,80,140,.15);

        opacity: 0;

        transform:
            translateY(35px)
            scale(.94);

        animation:
            wishReveal
            1.7s
            .8s
            cubic-bezier(.16,1,.3,1)
            forwards;
    }


    .wish span {
        display: block;

        margin-top: 15px;

        color: #ffadc5;

        font-size:
            clamp(
                85px,
                12vw,
                155px
            );
    }


    @keyframes wishReveal {

        to {
            opacity: 1;

            transform:
                translateY(0)
                scale(1);
        }

    }


    @keyframes reveal {

        to {
            opacity: 1;
        }

    }


    /* =====================================================
       SIMPLE MESSAGE
    ===================================================== */

    .message {
        margin:
            38px auto 0;

        max-width: 580px;

        font-family:
            "Playfair Display",
            serif;

        font-size:
            clamp(
                17px,
                2vw,
                21px
            );

        line-height: 1.7;

        color:
            rgba(255,255,255,.62);

        opacity: 0;

        animation:
            messageReveal
            1.2s
            1.7s
            forwards;
    }


    .message strong {
        color: #ffc0d2;

        font-weight: 400;
    }


    @keyframes messageReveal {

        from {
            opacity: 0;

            transform:
                translateY(20px);
        }

        to {
            opacity: 1;

            transform:
                translateY(0);
        }

    }


    /* =====================================================
       HEART DIVIDER
    ===================================================== */

    .divider {
        margin:
            35px auto 0;

        display: flex;

        align-items: center;
        justify-content: center;

        gap: 15px;

        opacity: 0;

        animation:
            reveal
            1s
            2.3s
            forwards;
    }


    .divider-line {
        width: 80px;
        height: 1px;

        background:
            linear-gradient(
                to right,
                transparent,
                rgba(255,180,200,.4)
            );
    }


    .divider-line:last-child {
        background:
            linear-gradient(
                to left,
                transparent,
                rgba(255,180,200,.4)
            );
    }


    .divider-heart {
        color: #ff9dbb;

        font-size: 17px;

        animation:
            heartBeat
            1.8s
            ease-in-out
            infinite;
    }


    @keyframes heartBeat {

        0%,
        100% {
            transform:
                scale(1);
        }

        50% {
            transform:
                scale(1.25);
        }

    }


    /* =====================================================
       TEDDY
    ===================================================== */

    .teddy {
        position: absolute;

        z-index: 12;

        font-size:
            clamp(
                65px,
                8vw,
                105px
            );

        filter:
            drop-shadow(
                0 18px 20px
                rgba(0,0,0,.35)
            );

        user-select: none;

        pointer-events: none;
    }


    .teddy.left {
        left:
            clamp(
                3%,
                8vw,
                11%
            );

        bottom:
            clamp(
                8%,
                13vh,
                17%
            );

        animation:
            teddyLeft
            4.5s
            ease-in-out
            infinite;
    }


    .teddy.right {
        right:
            clamp(
                3%,
                8vw,
                11%
            );

        top:
            clamp(
                20%,
                25vh,
                30%
            );

        animation:
            teddyRight
            5s
            1s
            ease-in-out
            infinite;
    }


    @keyframes teddyLeft {

        0%,
        100% {
            transform:
                translateY(0)
                rotate(-6deg);
        }

        50% {
            transform:
                translateY(-20px)
                rotate(5deg);
        }

    }


    @keyframes teddyRight {

        0%,
        100% {
            transform:
                translateY(0)
                rotate(6deg);
        }

        50% {
            transform:
                translateY(-25px)
                rotate(-5deg);
        }

    }


    /* =====================================================
       BALLOONS
    ===================================================== */

    .balloon {
        position: absolute;

        z-index: 5;

        width:
            clamp(
                55px,
                7vw,
                85px
            );

        height:
            clamp(
                70px,
                9vw,
                105px
            );

        border-radius:
            50% 50% 47% 47%;

        opacity: .82;

        box-shadow:
            inset
            -13px -15px 20px
            rgba(0,0,0,.12),

            inset
            12px 12px 20px
            rgba(255,255,255,.16),

            0 20px 35px
            rgba(0,0,0,.2);

        animation:
            balloonFloat
            5s
            ease-in-out
            infinite;
    }


    .balloon::before {
        content: "";

        position: absolute;

        left: 50%;
        bottom: -7px;

        transform:
            translateX(-50%);

        width: 0;
        height: 0;

        border-left:
            6px solid transparent;

        border-right:
            6px solid transparent;

        border-top:
            10px solid #d75c7f;
    }


    .balloon::after {
        content: "";

        position: absolute;

        left: 50%;
        top: 100%;

        width: 1px;
        height: 170px;

        background:
            linear-gradient(
                to bottom,
                rgba(255,255,255,.4),
                transparent
            );
    }


    .balloon.pink {
        background:
            radial-gradient(
                circle at 30% 25%,
                #ffdbe5,
                #ff8ead 45%,
                #d94772
            );
    }


    .balloon.rose {
        background:
            radial-gradient(
                circle at 30% 25%,
                #ffe4ec,
                #f46f99 45%,
                #a52f58
            );
    }


    .balloon.purple {
        background:
            radial-gradient(
                circle at 30% 25%,
                #eadcff,
                #b77cff 45%,
                #6638a0
            );
    }


    .balloon.one {
        left: 5%;
        top: 12%;

        animation-delay: -.5s;
    }


    .balloon.two {
        left: 17%;
        top: 20%;

        transform:
            scale(.75);

        animation-delay:
            -2s;
    }


    .balloon.three {
        right: 5%;
        bottom: 14%;

        animation-delay:
            -1.5s;
    }


    .balloon.four {
        right: 18%;
        top: 13%;

        transform:
            scale(.7);

        animation-delay:
            -3s;
    }


    @keyframes balloonFloat {

        0%,
        100% {
            transform:
                translateY(0)
                rotate(-3deg);
        }

        50% {
            transform:
                translateY(-25px)
                rotate(4deg);
        }

    }


    /* =====================================================
       FLOATING HEARTS
    ===================================================== */

    .heart {
        position: fixed;

        z-index: 30;

        pointer-events: none;

        color: #ff9fba;

        text-shadow:
            0 0 12px
            rgba(255,90,150,.65);

        animation:
            heartFloat
            linear
            forwards;
    }


    @keyframes heartFloat {

        0% {
            opacity: 0;

            transform:
                translateY(0)
                scale(.5)
                rotate(0);
        }

        15% {
            opacity: .8;
        }

        100% {
            opacity: 0;

            transform:
                translateY(-110vh)
                scale(1.35)
                rotate(40deg);
        }

    }


    /* =====================================================
       MOUSE HEART TRAIL
    ===================================================== */

    .mouse-heart {
        position: fixed;

        z-index: 100;

        pointer-events: none;

        font-size: 15px;

        color: #ffb0c7;

        text-shadow:
            0 0 10px
            rgba(255,90,150,.7);

        animation:
            mouseHeart
            .9s
            ease-out
            forwards;
    }


    @keyframes mouseHeart {

        from {
            opacity: .9;

            transform:
                translate(-50%, -50%)
                scale(.5);
        }

        to {
            opacity: 0;

            transform:
                translate(
                    -50%,
                    calc(-50% - 35px)
                )
                scale(1.4)
                rotate(20deg);
        }

    }


    /* =====================================================
       SPARKLES
    ===================================================== */

    .sparkle {
        position: absolute;

        z-index: 4;

        color:
            rgba(255,210,225,.8);

        font-size: 12px;

        animation:
            sparkle
            3s
            ease-in-out
            infinite;
    }


    .s1 {
        left: 27%;
        top: 23%;
    }

    .s2 {
        right: 28%;
        top: 32%;

        animation-delay:
            .8s;
    }

    .s3 {
        left: 20%;
        bottom: 27%;

        animation-delay:
            1.4s;
    }

    .s4 {
        right: 21%;
        bottom: 24%;

        animation-delay:
            2s;
    }


    @keyframes sparkle {

        0%,
        100% {
            opacity: .2;

            transform:
                scale(.7)
                rotate(0);
        }

        50% {
            opacity: 1;

            transform:
                scale(1.4)
                rotate(90deg);
        }

    }


    /* =====================================================
       BOTTOM
    ===================================================== */

    .bottom-note {
        position: absolute;

        bottom: 25px;
        left: 50%;

        transform:
            translateX(-50%);

        color:
            rgba(255,255,255,.25);

        font-size: 9px;

        letter-spacing: 4px;

        text-transform: uppercase;

        white-space: nowrap;
    }


    /* =====================================================
       CLICK BURST
    ===================================================== */

    .burst-heart {
        position: fixed;

        z-index: 200;

        pointer-events: none;

        font-size: 20px;

        color: #ff9eba;

        animation:
            burst
            1.2s
            cubic-bezier(.16,1,.3,1)
            forwards;
    }


    @keyframes burst {

        from {
            opacity: 1;

            transform:
                translate(-50%,-50%)
                scale(.3);
        }

        to {
            opacity: 0;

            transform:
                translate(
                    calc(-50% + var(--x)),
                    calc(-50% + var(--y))
                )
                scale(1.4)
                rotate(35deg);
        }

    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media(max-width: 700px) {

        .balloon.one {
            left: -5%;
        }

        .balloon.two {
            left: 5%;
        }

        .balloon.three {
            right: -5%;
        }

        .balloon.four {
            right: 5%;
        }

        .teddy.left {
            left: 2%;

            bottom: 9%;
        }

        .teddy.right {
            right: 2%;

            top: 19%;
        }

        .message {
            padding:
                0 15px;
        }

        .bottom-note {
            display: none;
        }

    }
/* =====================================================
   GO TO HOME BUTTON
===================================================== */

.home-btn {
    position: fixed;
    left: 50%;
    bottom: 32px;

    transform: translateX(-50%);

    z-index: 100;

    display: flex;
    align-items: center;
    gap: 9px;

    padding: 11px 20px;

    border: 1px solid rgba(255, 180, 205, 0.25);
    border-radius: 999px;

    background: rgba(255, 255, 255, 0.055);

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    color: rgba(255, 235, 242, 0.72);

    text-decoration: none;

    font-family: "DM Sans", sans-serif;
    font-size: 11px;
    font-weight: 400;

    letter-spacing: 1.5px;

    box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);

    transition:
        transform 0.35s cubic-bezier(.16, 1, .3, 1),
        background 0.35s ease,
        border-color 0.35s ease,
        color 0.35s ease,
        box-shadow 0.35s ease;
}

.home-icon {
    font-size: 17px;
    line-height: 1;

    color: #ffabc3;

    transition:
        transform 0.35s ease;
}

.home-btn:hover {
    transform:
        translateX(-50%)
        translateY(-4px);

    background:
        rgba(255, 145, 180, 0.12);

    border-color:
        rgba(255, 170, 195, 0.5);

    color: #fff;

    box-shadow:
        0 12px 40px rgba(255, 90, 140, 0.16),
        0 0 25px rgba(255, 120, 160, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
}

.home-btn:hover .home-icon {
    transform:
        translateY(-2px)
        scale(1.12);
}

.home-btn:active {
    transform:
        translateX(-50%)
        translateY(-1px)

}


/* Mobile */
@media (max-width: 700px) {

    .home-btn {
        bottom: 20px;

        padding: 10px 17px;

        font-size: 10px;
    }

}
</style>


</head>

<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script>
    const birthdaySong = document.getElementById("birthdaySong");
    const savedBirthdaySongTime =
        parseFloat(localStorage.getItem("birthdaySongTime") || "0");
    let birthdayMusicStarted = false;

    function resumeBirthdayMusic() {
        if (birthdayMusicStarted) return;

        const startMusic = () => {
            if (Number.isFinite(savedBirthdaySongTime) && savedBirthdaySongTime >= 0) {
                try {
                    birthdaySong.currentTime = savedBirthdaySongTime;
                } catch (e) {}
            }

            birthdaySong.volume = 0.65;

            birthdaySong.play()
                .then(() => {
                    birthdayMusicStarted = true;
                })
                .catch(() => {});
        };

        if (birthdaySong.readyState >= 1) {
            startMusic();
        } else {
            birthdaySong.addEventListener("loadedmetadata", startMusic, { once: true });
        }
    }

    resumeBirthdayMusic();

    ["pointerdown", "keydown", "touchstart"].forEach((eventName) => {
        document.addEventListener(eventName, resumeBirthdayMusic, { once: true, passive: true });
    });

    birthdaySong.addEventListener("timeupdate", () => {
        localStorage.setItem("birthdaySongTime", birthdaySong.currentTime.toString());
    });




    /* =====================================================
       MOUSE HEART TRAIL
    ====================================================== */

    let lastMouseHeart = 0;


    document.addEventListener(
        "mousemove",
        (event) => {

            const now =
                Date.now();


            if (
                now - lastMouseHeart < 80
            ) {
                return;
            }


            lastMouseHeart = now;


            const heart =
                document.createElement(
                    "div"
                );


            heart.className =
                "mouse-heart";


            const symbols = [
                "♡",
                "♥",
                "✦",
                "✧"
            ];


            heart.innerHTML =
                symbols[
                    Math.floor(
                        Math.random() *
                        symbols.length
                    )
                ];


            heart.style.left =
                event.clientX + "px";


            heart.style.top =
                event.clientY + "px";


            heart.style.fontSize =
                9 +
                Math.random() * 10 +
                "px";


            document.body.appendChild(
                heart
            );


            setTimeout(
                () => heart.remove(),
                1000
            );

        }
    );


    /* =====================================================
       FLOATING HEARTS
    ====================================================== */

    function createFloatingHeart() {

        const heart =
            document.createElement(
                "div"
            );


        heart.className =
            "heart";


        const symbols = [
            "♡",
            "♥",
            "❤",
            "💗",
            "✦"
        ];


        heart.innerHTML =
            symbols[
                Math.floor(
                    Math.random() *
                    symbols.length
                )
            ];


        heart.style.left =
            Math.random() * 100 +
            "vw";


        heart.style.bottom =
            "-30px";


        heart.style.fontSize =
            12 +
            Math.random() * 23 +
            "px";


        heart.style.animationDuration =
            7 +
            Math.random() * 8 +
            "s";


        heart.style.animationDelay =
            Math.random() * 2 +
            "s";


        document.body.appendChild(
            heart
        );


        setTimeout(
            () => heart.remove(),
            17000
        );

    }


    setInterval(
        createFloatingHeart,
        900
    );


    /* =====================================================
       CLICK HEART EXPLOSION
    ====================================================== */

    document.addEventListener(
        "click",
        (event) => {

            for (
                let i = 0;
                i < 18;
                i++
            ) {

                const heart =
                    document.createElement(
                        "div"
                    );


                heart.className =
                    "burst-heart";


                heart.innerHTML =
                    Math.random() > .3
                        ? "♥"
                        : "♡";


                heart.style.left =
                    event.clientX + "px";


                heart.style.top =
                    event.clientY + "px";


                const angle =
                    Math.random() *
                    Math.PI *
                    2;


                const distance =
                    50 +
                    Math.random() *
                    130;


                heart.style.setProperty(
                    "--x",
                    Math.cos(angle) *
                    distance +
                    "px"
                );


                heart.style.setProperty(
                    "--y",
                    Math.sin(angle) *
                    distance +
                    "px"
                );


                heart.style.fontSize =
                    10 +
                    Math.random() * 18 +
                    "px";


                document.body.appendChild(
                    heart
                );


                setTimeout(
                    () => heart.remove(),
                    1300
                );

            }

        }
    );


    /* =====================================================
       BALLOON PARALLAX
    ====================================================== */

    const balloons =
        document.querySelectorAll(
            ".balloon"
        );


    document.addEventListener(
        "mousemove",
        (event) => {

            const x =
                (
                    event.clientX /
                    window.innerWidth -
                    .5
                );


            const y =
                (
                    event.clientY /
                    window.innerHeight -
                    .5
                );


            balloons.forEach(
                (balloon, index) => {

                    const strength =
                        10 +
                        index * 4;


                    balloon.style.marginLeft =
                        x * strength +
                        "px";


                    balloon.style.marginTop =
                        y * strength +
                        "px";

                }
            );

        }
    );


    /* =====================================================
       RANDOM SPARKLE GENERATOR
    ====================================================== */

    function createSparkle() {

        const sparkle =
            document.createElement(
                "div"
            );


        sparkle.className =
            "sparkle";


        sparkle.innerHTML =
            Math.random() > .5
                ? "✦"
                : "✧";


        sparkle.style.left =
            5 +
            Math.random() * 90 +
            "%";


        sparkle.style.top =
            8 +
            Math.random() * 82 +
            "%";


        sparkle.style.fontSize =
            6 +
            Math.random() * 10 +
            "px";


        sparkle.style.animationDuration =
            2 +
            Math.random() * 3 +
            "s";


        document.querySelector(
            ".background"
        ).appendChild(
            sparkle
        );


        setTimeout(
            () => sparkle.remove(),
            5000
        );

    }


    setInterval(
        createSparkle,
        650
    );


    /* =====================================================
       SUBTLE 3D TILT
    ====================================================== */

    const content =
        document.querySelector(
            ".content"
        );


    document.addEventListener(
        "mousemove",
        (event) => {

            const x =
                (
                    event.clientX /
                    window.innerWidth -
                    .5
                );


            const y =
                (
                    event.clientY /
                    window.innerHeight -
                    .5
                );


            content.style.transform =
                `
                translateY(-10px)
                perspective(1000px)
                rotateX(${y * -2}deg)
                rotateY(${x * 3}deg)
                `;

        }
    );


    /* =====================================================
       RETURN TO NORMAL ON LEAVE
    ====================================================== */

    document.addEventListener(
        "mouseleave",
        () => {

            content.style.transform =
                "translateY(-10px)";

        }
    );

</script>

</body>

</html>
